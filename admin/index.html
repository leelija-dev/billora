<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Company-Based Multi-Tenant SaaS ERP System - Complete business management solution" />
    <meta name="keywords" content="ERP, SaaS, Business Management, Inventory, Orders, Invoicing" />
    <meta name="author" content="Your Company" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SaaS ERP - Business Management System" />
    <meta property="og:description" content="Complete ERP solution for modern businesses" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SaaS ERP - Business Management System" />
    <meta name="twitter:description" content="Complete ERP solution for modern businesses" />
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SaaS ERP" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Title -->
    <title>SaaS ERP - Multi-Tenant Business Management System</title>
    
    <!-- Preconnect to API domain -->
    <link rel="preconnect" href="http://localhost:8000" />
    <link rel="dns-prefetch" href="http://localhost:8000" />
    
    <!-- Inline loading styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      .loading-content {
        text-align: center;
        padding: 2rem;
        animation: fadeInUp 0.6s ease-out;
      }
      
      .loading-logo {
        font-size: 3.5rem;
        font-weight: 700;
        color: white;
        margin-bottom: 1.5rem;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        letter-spacing: 2px;
      }
      
      .loading-spinner-wrapper {
        margin-bottom: 2rem;
      }
      
      .loading-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 1.5rem;
        position: relative;
      }
      
      .spinner-ring {
        width: 100%;
        height: 100%;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-right-color: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      }
      
      .spinner-inner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-bottom-color: #ffffff;
        border-left-color: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
      }
      
      .loading-text {
        color: white;
        font-size: 1.5rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      
      .loading-subtext {
        color: rgba(255, 255, 255, 0.85);
        font-size: 1rem;
        margin-bottom: 2rem;
        opacity: 0.9;
      }
      
      .loading-progress {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 100px;
        overflow: hidden;
        margin: 0 auto;
        position: relative;
      }
      
      .loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ffffff 0%, #e0e7ff 100%);
        border-radius: 100px;
        animation: progress 2.5s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      
      .loading-dots {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }
      
      .dot {
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      .dot:nth-child(2) {
        animation-delay: 0.3s;
        background: rgba(255, 255, 255, 0.6);
      }
      
      .dot:nth-child(3) {
        animation-delay: 0.6s;
        background: rgba(255, 255, 255, 0.8);
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { 
          transform: scale(1); 
          opacity: 0.4;
        }
        50% { 
          transform: scale(1.3); 
          opacity: 1;
        }
      }
      
      @keyframes progress {
        0% { width: 0%; margin-left: 0; }
        20% { width: 30%; margin-left: 0; }
        40% { width: 60%; margin-left: 0; }
        60% { width: 75%; margin-left: 0; }
        80% { width: 90%; margin-left: 0; }
        90% { width: 100%; margin-left: 0; }
        100% { width: 0%; margin-left: 100%; }
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      
      /* Mobile optimization */
      @media (max-width: 640px) {
        .loading-logo {
          font-size: 2.5rem;
        }
        
        .loading-text {
          font-size: 1.2rem;
        }
        
        .loading-spinner {
          width: 50px;
          height: 50px;
        }
        
        .spinner-inner {
          width: 32px;
          height: 32px;
        }
        
        .loading-progress {
          width: 160px;
        }
      }
      
      /* Reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner,
        .spinner-inner,
        .dot,
        .loading-progress-bar {
          animation-duration: 3s;
        }
        
        .loading-content {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Enhanced loading script for better UX -->
    <script>
      (function() {
        // Performance mark for loading start
        if (window.performance && window.performance.mark) {
          window.performance.mark('loading-start');
        }
        
        const root = document.getElementById('root');
        if (!root) return;
        
        // Create loading UI with enhanced design
        const loadingHTML = `
          <div class="loading-container" id="app-loader">
            <div class="loading-content">
              <div class="loading-logo">The Fast Bill</div>
              
              <div class="loading-spinner-wrapper">
                <div class="loading-spinner">
                  <div class="spinner-ring"></div>
                  <div class="spinner-inner"></div>
                </div>
              </div>
              
              <div class="loading-text">Loading Your Workspace</div>
              <div class="loading-subtext">Preparing Your Management Dashboard...</div>
              
              <div class="loading-progress">
                <div class="loading-progress-bar"></div>
              </div>
              
              <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
              </div>
            </div>
          </div>
        `;
        
        root.innerHTML = loadingHTML;
        
        // Store loader element reference for potential early removal
        window.__appLoader = document.getElementById('app-loader');
        
        // Update loading message periodically for better UX
        const loadingMessages = [
          { text: 'Loading Your Workspace', sub: 'Preparing your business dashboard...' },
          { text: 'Almost Ready', sub: 'Setting up secure connection...' },
          { text: 'Just a Moment', sub: 'Loading your modules...' }
        ];
        
        let messageIndex = 0;
        const messageInterval = setInterval(() => {
          messageIndex = (messageIndex + 1) % loadingMessages.length;
          const textEl = document.querySelector('.loading-text');
          const subEl = document.querySelector('.loading-subtext');
          
          if (textEl && subEl) {
            textEl.style.opacity = '0';
            subEl.style.opacity = '0';
            
            setTimeout(() => {
              textEl.textContent = loadingMessages[messageIndex].text;
              subEl.textContent = loadingMessages[messageIndex].sub;
              textEl.style.transition = 'opacity 0.3s ease-in-out';
              subEl.style.transition = 'opacity 0.3s ease-in-out';
              textEl.style.opacity = '1';
              subEl.style.opacity = '1';
            }, 200);
          }
        }, 3000);
        
        // Clean up interval when page fully loads
        window.addEventListener('load', () => {
          clearInterval(messageInterval);
          
          // Performance marks
          if (window.performance && window.performance.mark) {
            window.performance.mark('loading-end');
            window.performance.measure('loading-duration', 'loading-start', 'loading-end');
          }
        });
        
        // Auto-remove loader after timeout (fallback)
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader && loader.parentNode) {
            loader.style.opacity = '0';
            setTimeout(() => {
              if (loader.parentNode) {
                loader.remove();
              }
            }, 300);
          }
          clearInterval(messageInterval);
        }, 15000); // 15 second fallback
      })();
    </script>
  </body>
</html>
